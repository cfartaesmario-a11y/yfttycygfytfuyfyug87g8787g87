<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10213d;--paper:#fffaf0;--muted:#5d6b85;--red:#ff3d5a;--sky:#2e8bff;--line:rgba(16,33,61,.18)}
@media (prefers-color-scheme: dark){:root{--ink:#eaf1ff;--paper:#16223d;--muted:#9fb1d4;--line:rgba(234,241,255,.2)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(#3aa6ff,#c6ecff 70%,#79c95a 70%,#4f9e3a);
  font-family:'Rubik','Trebuchet MS',system-ui,sans-serif;color:var(--ink)}
.pass{width:min(440px,100%);background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.top{background:var(--red);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.top b{font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:22px}
.top span{font-weight:700;font-size:13px;opacity:.9}
.body{padding:28px 20px 22px;text-align:center}
.plane{font-size:48px;line-height:1}
h1{font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:clamp(30px,9vw,42px);margin:12px 0 6px;line-height:1.05}
p{color:var(--muted);margin:0 0 22px;font-size:16px}
a.go{display:block;text-decoration:none;border-radius:14px;background:var(--sky);color:#fff;
  font-family:'Bungee',Impact,sans-serif;font-size:21px;padding:15px;box-shadow:0 5px 0 #1a5fbf}
a.go:active{transform:translateY(3px);box-shadow:0 2px 0 #1a5fbf}
a.go:focus-visible{outline:3px solid #ffc21a;outline-offset:3px}
.url{display:block;margin-top:14px;font-size:13px;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
  <main class="pass">
    <div class="top"><b>CLASSROOM</b><span>Boarding pass</span></div>
    <div class="body">
      <div class="plane" aria-hidden="true">✈️</div>
      <h1>New game here</h1>
      <p>Tap the button to start playing.</p>
      <a class="go" href="https://cfartaesmario-a11y.github.io/marioyassir/">Play now</a>
      <a class="url" href="https://cfartaesmario-a11y.github.io/marioyassir/">cfartaesmario-a11y.github.io/marioyassir</a>
    </div>
  </main>
</body>
</html>

  #hud .center-ret:before{ left:50%; top:-7px; width:1px; height:7px; transform:translateX(-50%);}

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SkeletonUtils } from 'three/addons/utils/SkeletonUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   CONFIG  — toca aquí para ajustar calidad / rendimiento
   ============================================================ */
const CONFIG = {
  // "high" o "low". En Chromebook/portátil flojo usa "low".
  quality: 'high',

  // Carpeta de modelos y nombres EXACTOS de archivo (ver README).
  modelDir: './models/',
  // Nombres EXACTOS tal cual los subiste (no hace falta renombrar nada).
  models: {
    terrorist:   'cs2_terrorist.glb',                      // NPC principal (viene en pose)
    soldier:     'soldier_15_-_nowicho.glb',               // guardia extra (opcional)
    jeep:        'jeep.glb',
    nissan:      'nissan_4x4.glb',
    houseA:      'desert_house.glb',
    houseB:      'desert_mud_concrete_house_lowpoly.glb',
    houseCluster:'desert_houses.glb',
    sandbags:    'sandbags_-_defense_line.glb',
    blockpost:   'military_blockpost_s_t_a_l_k_e_r.glb',
    grass:       'dry_grass.glb',
    // Pesados: actívalos solo si tu equipo aguanta (ver flags abajo)
    street:      'apocalyptic_street.glb',
    ruins:       'destroyed_buildings.glb',
  },

  // Flags de modelos pesados (por defecto OFF por rendimiento)
  loadStreet: false,
  loadRuins:  false,
  loadNissan: true,   // 56 MB, bájalo a false si tarda mucho

  cinematic: true,    // filtros cinemáticos on/off (tecla F)
};

const Q = CONFIG.quality === 'high'
  ? { pixelRatio:Math.min(devicePixelRatio,2), shadow:2048, npc:18, grass:4500, rocks:900, trees:420, bloom:0.55 }
  : { pixelRatio:1,                             shadow:1024, npc:8,  grass:1600, rocks:380, trees:160, bloom:0.4 };

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Q.pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.3, 4000);
camera.position.set(0, 42, 95);
camera.lookAt(0, 6, 0);

// Niebla atmosférica cálida (profundidad cinematográfica)
scene.fog = new THREE.FogExp2(0xcdbb95, 0.0022);

/* ---- Cielo realista + sol ---- */
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const sun = new THREE.Vector3();
const skyU = sky.material.uniforms;
skyU.turbidity.value = 8;
skyU.rayleigh.value = 1.6;
skyU.mieCoefficient.value = 0.006;
skyU.mieDirectionalG.value = 0.8;
const sunElev = 14, sunAzi = 115;       // sol bajo = luz dorada rasante
const phi = THREE.MathUtils.degToRad(90 - sunElev);
const theta = THREE.MathUtils.degToRad(sunAzi);
sun.setFromSphericalCoords(1, phi, theta);
skyU.sunPosition.value.copy(sun);

/* ---- Luces ---- */
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0xcdb98a, 0.55);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xfff1cf, 2.7);
dir.position.copy(sun).multiplyScalar(220);
dir.castShadow = true;
dir.shadow.mapSize.set(Q.shadow, Q.shadow);
dir.shadow.camera.near = 10; dir.shadow.camera.far = 650;
const sc = 260;
dir.shadow.camera.left=-sc; dir.shadow.camera.right=sc;
dir.shadow.camera.top=sc; dir.shadow.camera.bottom=-sc;
dir.shadow.bias = -0.0004;
dir.shadow.normalBias = 0.6;
scene.add(dir);
scene.add(dir.target);

// Entorno PBR (reflejos suaves) con RoomEnvironment — estable y barato
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ============================================================
   RUIDO + FUNCIÓN DE ALTURA (grounding analítico)
   La MISMA función construye el terreno y coloca TODO,
   por eso nada "vuela".
   ============================================================ */
function hash(x, z){
  let h = Math.sin(x*127.1 + z*311.7) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, z){
  const xi=Math.floor(x), zi=Math.floor(z);
  const xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  const a=hash(xi,zi), b=hash(xi+1,zi), c=hash(xi,zi+1), d=hash(xi+1,zi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x, z, oct=4){
  let s=0, amp=0.5, f=1;
  for(let i=0;i<oct;i++){ s+=amp*vnoise(x*f, z*f); f*=2.03; amp*=0.5; }
  return s;
}

// ---- Carreteras (polilíneas analíticas) ----
function mainRoadZ(x){ return 22*Math.sin(x*0.0045) + 8*Math.sin(x*0.013); }
function crossRoadX(z){ return -55 + 16*Math.sin(z*0.006); }
function roadDist(x, z){
  const dMain = Math.abs(z - mainRoadZ(x));
  const dCross = Math.abs(x - crossRoadX(z));
  return Math.min(dMain, dCross);
}
const ROAD_HALF = 5.5, ROAD_SHOULDER = 9;

// ---- Zonas de bosque (matorral denso) ----
const FORESTS = [ {x:120,z:-70,r:70}, {x:-150,z:120,r:85}, {x:60,z:160,r:60} ];
function forestFactor(x, z){
  let f=0;
  for(const F of FORESTS){
    const d=Math.hypot(x-F.x, z-F.z);
    f=Math.max(f, 1-smooth(F.r*0.5, F.r, d));
  }
  return f;
}
function smooth(e0,e1,x){ const t=THREE.MathUtils.clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }

// ---- Altura del terreno en (x,z) ----
const TERRAIN=620;
function terrainHeight(x, z){
  // relieve base
  let base = fbm(x*0.004+10, z*0.004+5, 5)*26 - 6;
  base += fbm(x*0.016, z*0.016, 3)*4;          // detalle
  // bordes elevados (cuenca)
  const edge = Math.max(Math.abs(x), Math.abs(z))/(TERRAIN*0.5);
  base += smooth(0.55,1.0,edge)*55;
  // carretera: aplanar y rebajar
  const d = roadDist(x,z);
  const rf = 1 - smooth(ROAD_HALF, ROAD_HALF+ROAD_SHOULDER, d);
  if(rf>0){
    const roadH = fbm(x*0.004+10, z*0.004+5, 2)*10 - 7.4;
    base = THREE.MathUtils.lerp(base, roadH, rf);
  }
  return base;
}
function onRoad(x,z){ return roadDist(x,z) < ROAD_HALF+1.5; }
function groundNormal(x,z){
  const e=1.2;
  const hL=terrainHeight(x-e,z), hR=terrainHeight(x+e,z);
  const hD=terrainHeight(x,z-e), hU=terrainHeight(x,z+e);
  return new THREE.Vector3(hL-hR, 2*e, hD-hU).normalize();
}

/* ============================================================
   MALLA DEL TERRENO  (con vertex colors: arena/roca/carretera/bosque)
   ============================================================ */
const SEG = CONFIG.quality==='high' ? 300 : 200;
const geo = new THREE.PlaneGeometry(TERRAIN, TERRAIN, SEG, SEG);
geo.rotateX(-Math.PI/2);
const pos = geo.attributes.position;
const colors = new Float32Array(pos.count*3);
const cSand=new THREE.Color(0xb8a06a), cDirt=new THREE.Color(0x8c7346),
      cRock=new THREE.Color(0x6f6656), cRoad=new THREE.Color(0x4f473b),
      cForest=new THREE.Color(0x5f6b3c), tmpC=new THREE.Color();
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), z=pos.getZ(i);
  const h=terrainHeight(x,z);
  pos.setY(i,h);
  const n=groundNormal(x,z);
  const slope=1-n.y;                 // 0 plano … 1 vertical
  const d=roadDist(x,z);
  const rf=1-smooth(ROAD_HALF,ROAD_HALF+ROAD_SHOULDER,d);
  const ff=forestFactor(x,z);
  tmpC.copy(cSand);
  tmpC.lerp(cDirt, smooth(0,18,h)*0.6 + hash(x*3,z*3)*0.12);
  tmpC.lerp(cRock, smooth(0.28,0.6,slope));
  tmpC.lerp(cForest, ff*0.8*(1-rf));
  tmpC.lerp(cRoad, rf);
  const tint=0.9+hash(x*1.7,z*2.3)*0.2;   // grano de color
  colors[i*3]=tmpC.r*tint; colors[i*3+1]=tmpC.g*tint; colors[i*3+2]=tmpC.b*tint;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
geo.computeVertexNormals();
const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.97, metalness:0.0, flatShading:false });
const terrain = new THREE.Mesh(geo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

/* ============================================================
   CARGADOR DE MODELOS (tolerante a fallos)
   ============================================================ */
const loader = new GLTFLoader();
const ASSETS = {};
const errBox = document.getElementById('err');
let errLines = [];
function logErr(msg){ errLines.push(msg); errBox.innerHTML = errLines.slice(-4).join('<br>'); }

function loadGLB(key){
  return new Promise((resolve)=>{
    const file = CONFIG.models[key];
    loader.load(CONFIG.modelDir+file,
      g=>{ ASSETS[key]=g; resolve(g); },
      undefined,
      e=>{ logErr('⚠ No se cargó '+file+' (se omite)'); resolve(null); });
  });
}

// Normaliza escala y pone los "pies"/base en y=0 local
function normalize(obj, targetDim, mode='max'){
  const box=new THREE.Box3().setFromObject(obj);
  const size=new THREE.Vector3(); box.getSize(size);
  let cur = mode==='height'?size.y : mode==='xz'?Math.max(size.x,size.z) : Math.max(size.x,size.y,size.z);
  if(cur<=0||!isFinite(cur)) cur=1;
  const s=targetDim/cur; obj.scale.setScalar(s);
  const box2=new THREE.Box3().setFromObject(obj);
  const c=new THREE.Vector3(); box2.getCenter(c);
  obj.position.x -= c.x; obj.position.z -= c.z;      // centrar en XZ
  obj.position.y -= box2.min.y;                      // base a y=0
  return obj;
}
function enableShadows(obj){
  obj.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true;
    if(o.material){ o.material.side=THREE.FrontSide; } } });
}

/* ============================================================
   ARRANQUE
   ============================================================ */
const bar=document.querySelector('#bar > i'), pct=document.getElementById('pct'),
      startBtn=document.getElementById('startBtn'), loadEl=document.getElementById('load');

const npcs=[], vehicles=[], mixers=[];
const dustEmitters=[];

async function boot(){
  const queue = ['terrorist','soldier','jeep','houseA','houseB','houseCluster','sandbags','blockpost','grass'];
  if(CONFIG.loadNissan) queue.push('nissan');
  if(CONFIG.loadStreet) queue.push('street');
  if(CONFIG.loadRuins)  queue.push('ruins');

  let done=0;
  for(const k of queue){
    pct.textContent='CARGANDO '+CONFIG.models[k].toUpperCase();
    await loadGLB(k);
    done++; bar.style.width=Math.round(done/queue.length*85)+'%';
  }

  pct.textContent='CONSTRUYENDO ESCENA';
  buildWorld();
  bar.style.width='100%';
  pct.textContent='LISTO';
  startBtn.style.display='inline-block';
}

/* ============================================================
   CONSTRUCCIÓN DEL MUNDO
   ============================================================ */
function place(obj, x, z, yaw=0, alignGround=false, yOff=0){
  obj.position.x=x; obj.position.z=z;
  obj.position.y=terrainHeight(x,z)+yOff;
  obj.rotation.y=yaw;
  if(alignGround){
    const n=groundNormal(x,z);
    const up=new THREE.Vector3(0,1,0);
    const q=new THREE.Quaternion().setFromUnitVectors(up,n);
    obj.quaternion.premultiply(q);
    obj.rotateY(yaw);
  }
  scene.add(obj);
  return obj;
}

function buildWorld(){
  // ---------- Vegetación: hierba seca (instanced) ----------
  if(ASSETS.grass){
    let gmesh=null;
    ASSETS.grass.scene.traverse(o=>{ if(o.isMesh && !gmesh) gmesh=o; });
    if(gmesh){
      const tmp=new THREE.Object3D();
      const ib=new THREE.Box3().setFromObject(ASSETS.grass.scene);
      const gs=2.4/Math.max(0.001,(ib.max.y-ib.min.y));
      const inst=new THREE.InstancedMesh(gmesh.geometry, gmesh.material, Q.grass);
      inst.castShadow=false; inst.receiveShadow=true;
      let n=0;
      for(let i=0;i<Q.grass*3 && n<Q.grass;i++){
        const x=(Math.random()-0.5)*TERRAIN*0.92, z=(Math.random()-0.5)*TERRAIN*0.92;
        if(onRoad(x,z)) continue;
        const ff=forestFactor(x,z);
        if(Math.random() > 0.25+ff*0.7) continue;      // más densa en bosque
        tmp.position.set(x, terrainHeight(x,z), z);
        tmp.rotation.set(0, Math.random()*Math.PI*2, 0);
        tmp.scale.setScalar(gs*(0.7+Math.random()*0.8));
        tmp.updateMatrix(); inst.setMatrixAt(n++, tmp.matrix);
      }
      inst.count=n; inst.instanceMatrix.needsUpdate=true;
      scene.add(inst);
    }
  }

  // ---------- Rocas (instanced, low-poly) ----------
  {
    const rg=new THREE.IcosahedronGeometry(1,0);
    const rp=rg.attributes.position;
    for(let i=0;i<rp.count;i++){
      rp.setXYZ(i, rp.getX(i)*(0.7+hash(i,1)*0.6),
                   rp.getY(i)*(0.6+hash(i,2)*0.5),
                   rp.getZ(i)*(0.7+hash(i,3)*0.6));
    }
    rg.computeVertexNormals();
    const rmat=new THREE.MeshStandardMaterial({color:0x7a7162, roughness:1, flatShading:true});
    const inst=new THREE.InstancedMesh(rg, rmat, Q.rocks);
    inst.castShadow=true; inst.receiveShadow=true;
    const tmp=new THREE.Object3D(); let n=0;
    for(let i=0;i<Q.rocks*2 && n<Q.rocks;i++){
      const x=(Math.random()-0.5)*TERRAIN*0.95, z=(Math.random()-0.5)*TERRAIN*0.95;
      if(onRoad(x,z) && Math.random()>0.25) continue;
      const nrm=groundNormal(x,z); const slope=1-nrm.y;
      if(Math.random() > 0.3+slope*1.8) continue;        // más en pendiente
      const s=0.4+Math.random()*2.4;
      tmp.position.set(x, terrainHeight(x,z)+s*0.25, z);
      tmp.rotation.set(Math.random(),Math.random()*6,Math.random());
      tmp.scale.set(s,s*(0.6+Math.random()*0.5),s);
      tmp.updateMatrix(); inst.setMatrixAt(n++,tmp.matrix);
    }
    inst.count=n; inst.instanceMatrix.needsUpdate=true;
    scene.add(inst);
  }

  // ---------- Árboles low-poly en zonas de bosque ----------
  {
    const trunkG=new THREE.CylinderGeometry(0.16,0.26,2.4,5);
    trunkG.translate(0,1.2,0);
    const leafG=new THREE.ConeGeometry(1.5,3.6,6);
    leafG.translate(0,3.9,0);
    const trunkM=new THREE.MeshStandardMaterial({color:0x5a4631,roughness:1});
    const leafM=new THREE.MeshStandardMaterial({color:0x4f5d31,roughness:1,flatShading:true});
    const tInst=new THREE.InstancedMesh(trunkG,trunkM,Q.trees);
    const lInst=new THREE.InstancedMesh(leafG,leafM,Q.trees);
    tInst.castShadow=lInst.castShadow=true; lInst.receiveShadow=true;
    const tmp=new THREE.Object3D(); let n=0;
    for(let i=0;i<Q.trees*4 && n<Q.trees;i++){
      const F=FORESTS[i%FORESTS.length];
      const a=Math.random()*6.283, r=Math.sqrt(Math.random())*F.r;
      const x=F.x+Math.cos(a)*r, z=F.z+Math.sin(a)*r;
      if(onRoad(x,z)) continue;
      const s=0.8+Math.random()*0.9;
      tmp.position.set(x,terrainHeight(x,z),z);
      tmp.rotation.set(0,Math.random()*6,0);
      tmp.scale.set(s,s*(0.9+Math.random()*0.4),s);
      tmp.updateMatrix();
      tInst.setMatrixAt(n,tmp.matrix); lInst.setMatrixAt(n,tmp.matrix); n++;
    }
    tInst.count=lInst.count=n;
    tInst.instanceMatrix.needsUpdate=lInst.instanceMatrix.needsUpdate=true;
    scene.add(tInst); scene.add(lInst);
  }

  // ---------- Aldea de casas ----------
  const village=[];
  function addHouse(asset, dim, x, z, yaw){
    if(!asset) return;
    const h=asset.scene.clone(true); enableShadows(h); normalize(h,dim,'xz');
    place(h,x,z,yaw); village.push({x,z,r:dim*0.75});
  }
  // núcleo del pueblo cerca del cruce de carreteras
  const vx=crossRoadX(0), vz=mainRoadZ(vx);
  addHouse(ASSETS.houseA, 9, vx+18, vz-16, 0.4);
  addHouse(ASSETS.houseA, 8, vx-20, vz-22, -0.8);
  addHouse(ASSETS.houseB, 12, vx+26, vz+20, 1.6);
  addHouse(ASSETS.houseB, 11, vx-30, vz+14, -0.3);
  addHouse(ASSETS.houseA, 8, vx+4,  vz+34, 2.1);
  if(ASSETS.houseCluster){
    const c=ASSETS.houseCluster.scene.clone(true); enableShadows(c); normalize(c,48,'xz');
    place(c, vx-70, vz+60, 0.6);
  }

  // ---------- Checkpoint: blockpost + línea de sacos ----------
  const cpx=120, cpz=mainRoadZ(cpx);
  if(ASSETS.blockpost){
    const b=ASSETS.blockpost.scene.clone(true); enableShadows(b); normalize(b,14,'max');
    place(b, cpx, cpz-10, -1.1);
  }
  const sandLine=[];
  if(ASSETS.sandbags){
    for(let i=0;i<6;i++){
      const s=ASSETS.sandbags.scene.clone(true); enableShadows(s); normalize(s,4.2,'xz');
      const sx=cpx-14+i*5.2, sz=cpz+7+Math.sin(i)*1.2;
      place(s, sx, sz, Math.PI/2+0.1*i, true);
      sandLine.push({x:sx,z:sz});
    }
  }
  // segunda línea de sacos para el "frente" (enfrentamiento)
  const frontA={x:-120,z:mainRoadZ(-120)}, frontB={x:-120,z:mainRoadZ(-120)+55};
  if(ASSETS.sandbags){
    for(let i=0;i<4;i++){
      const s1=ASSETS.sandbags.scene.clone(true); enableShadows(s1); normalize(s1,4,'xz');
      place(s1, frontA.x-8+i*5, frontA.z, 0, true);
      const s2=ASSETS.sandbags.scene.clone(true); enableShadows(s2); normalize(s2,4,'xz');
      place(s2, frontB.x-8+i*5, frontB.z, Math.PI, true);
    }
  }

  // ---------- Escombros pesados opcionales ----------
  if(ASSETS.street){ const s=ASSETS.street.scene.clone(true); enableShadows(s);
    normalize(s,180,'xz'); place(s,-200,180,0.3); }
  if(ASSETS.ruins){ const r=ASSETS.ruins.scene.clone(true); enableShadows(r);
    normalize(r,220,'xz'); place(r,210,-160,1.2); }

  /* ---------------- NPCs (terroristas) ---------------- */
  buildNPCsAndVehicles({village, sandLine, cp:{x:cpx,z:cpz}, frontA, frontB, vx, vz});
}

/* ============================================================
   NPCs + VEHÍCULOS  (IA con máquina de estados, bucle infinito)
   ============================================================ */
function makeNPC(){
  if(!ASSETS.terrorist) return null;
  const obj = SkeletonUtils.clone(ASSETS.terrorist.scene);
  enableShadows(obj);
  normalize(obj, 1.8, 'height');
  // aplica la pose del clip (aunque dure 0, fija la postura natural)
  if(ASSETS.terrorist.animations && ASSETS.terrorist.animations.length){
    const m=new THREE.AnimationMixer(obj);
    const a=m.clipAction(ASSETS.terrorist.animations[0]); a.play(); m.update(0);
    mixers.push(m);
  }
  const holder=new THREE.Group();
  holder.add(obj);
  scene.add(holder);
  return holder;
}

function groundEntity(g, yOff=0){ g.position.y = terrainHeight(g.position.x, g.position.z)+yOff; }

function buildNPCsAndVehicles(S){
  // --- muzzle flash pool ---
  const flashGeo=new THREE.SphereGeometry(0.22,6,6);
  const flashMat=new THREE.MeshBasicMaterial({color:0xffd27a,transparent:true,opacity:0});
  const flashes=[];
  for(let i=0;i<10;i++){ const f=new THREE.Mesh(flashGeo,flashMat.clone()); f.visible=false; scene.add(f); flashes.push(f);}
  window.__flashes=flashes;

  const N = Q.npc;
  let made=0;

  // 1) GUARDIAS en checkpoint (estáticos escaneando)
  for(let i=0;i<Math.min(3,N) && S.sandLine.length;i++){
    const g=makeNPC(); if(!g) break;
    const p=S.sandLine[i*2 % S.sandLine.length];
    g.position.set(p.x, 0, p.z-2); groundEntity(g);
    npcs.push({g, kind:'guard', t:Math.random()*6, home:{x:p.x,z:p.z-2}, dir:Math.random()*6}); made++;
  }

  // 2) ENFRENTAMIENTO: dos bandos tras los sacos del frente
  const fighters=[];
  for(let i=0;i<Math.min(6,N-made);i++){
    const g=makeNPC(); if(!g) break;
    const side = i%2===0 ? S.frontA : S.frontB;
    const x=side.x-7+(i>>1)*4.5 + (Math.random()-0.5), z=side.z + (i%2===0? -1.5:1.5);
    g.position.set(x,0,z); groundEntity(g);
    const face = i%2===0 ? 0 : Math.PI;   // se miran entre sí
    const npc={g, kind:'fight', t:Math.random()*4, home:{x,z}, dir:face, side:i%2};
    npcs.push(npc); fighters.push(npc); made++;
  }
  window.__fighters=fighters;

  // 3) PATRULLAS por carretera y pueblo (caminan en bucle)
  const patrolPaths=[
    // ronda por el pueblo
    [ {x:S.vx-30,z:S.vz-10},{x:S.vx+20,z:S.vz-18},{x:S.vx+30,z:S.vz+22},{x:S.vx-26,z:S.vz+24} ],
    // patrulla por la carretera principal
    [ {x:-40,z:mainRoadZ(-40)},{x:40,z:mainRoadZ(40)},{x:90,z:mainRoadZ(90)},{x:30,z:mainRoadZ(30)} ],
  ];
  let pp=0;
  while(made<N){
    const g=makeNPC(); if(!g) break;
    const path=patrolPaths[pp%patrolPaths.length]; pp++;
    const wp=Math.floor(Math.random()*path.length);
    g.position.set(path[wp].x,0,path[wp].z); groundEntity(g);
    npcs.push({g, kind:'patrol', path, wp, speed:1.6+Math.random()*0.8, t:Math.random()*10,
               bob:Math.random()*6}); made++;
  }

  /* -------- VEHÍCULOS -------- */
  function makeVehicle(asset, dim){
    if(!asset) return null;
    const v=asset.scene.clone(true); enableShadows(v); normalize(v,dim,'xz');
    const holder=new THREE.Group(); holder.add(v); scene.add(holder);
    return holder;
  }
  // jeep: patrulla rápida por la carretera principal (transporte de tropas)
  const jeep=makeVehicle(ASSETS.jeep,4.8);
  if(jeep){
    vehicles.push({g:jeep, x:-250, dir:1, speed:16, road:'main', escort:[]});
  }
  // nissan: patrulla en sentido contrario
  if(CONFIG.loadNissan && ASSETS.nissan){
    const nis=makeVehicle(ASSETS.nissan,4.9);
    if(nis) vehicles.push({g:nis, x:260, dir:-1, speed:12, road:'main'});
  }

  // tropas escoltando al jeep (transporte): 2 NPCs lo siguen y luego patrullan
  for(let i=0;i<Math.min(2,Math.max(0,N-made));i++){
    const g=makeNPC(); if(!g) break;
    npcs.push({g, kind:'escort', target:vehicles[0], offset:{x:(i?3:-3),z:4}, speed:4, bob:i*3});
    made++;
  }

  document.getElementById('coord').textContent =
    'NPC '+npcs.length+'  ·  VEH '+vehicles.length+'  ·  Q='+CONFIG.quality.toUpperCase();
}

/* ============================================================
   DUST  (polvo en carreteras + estela de vehículos)
   ============================================================ */
let dust, dustPos, dustData, DUSTN=0;
function initDust(){
  DUSTN = CONFIG.quality==='high'?700:300;
  const g=new THREE.BufferGeometry();
  dustPos=new Float32Array(DUSTN*3);
  dustData=[];
  for(let i=0;i<DUSTN;i++){
    const x=(Math.random()-0.5)*TERRAIN*0.8;
    const z=(Math.random()-0.5)*TERRAIN*0.8;
    dustPos[i*3]=x; dustPos[i*3+1]=terrainHeight(x,z)+Math.random()*3; dustPos[i*3+2]=z;
    dustData.push({x,z,vy:0.05+Math.random()*0.1,life:Math.random(),road:onRoad(x,z)});
  }
  g.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
  const tex=makeDustTex();
  const m=new THREE.PointsMaterial({size:2.6,map:tex,transparent:true,opacity:0.14,
    depthWrite:false,color:0xd9c79a,blending:THREE.NormalBlending});
  dust=new THREE.Points(g,m); scene.add(dust);
}
function makeDustTex(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const x=c.getContext('2d');
  const gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,0.9)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gr; x.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); return t;
}
function spawnVehicleDust(x,z){
  // reubica una partícula cercana al vehículo (estela)
  const i=Math.floor(Math.random()*DUSTN);
  dustData[i].x=x+(Math.random()-0.5)*3; dustData[i].z=z+(Math.random()-0.5)*3;
  dustData[i].life=1; dustData[i].road=true;
  dustPos[i*3]=dustData[i].x; dustPos[i*3+1]=terrainHeight(dustData[i].x,dustData[i].z)+0.3;
  dustPos[i*3+2]=dustData[i].z;
}

/* ============================================================
   FREE CAMERA  (fly / UAV) con pointer lock
   ============================================================ */
const key={};
addEventListener('keydown',e=>{ key[e.code]=true;
  if(e.code==='KeyF'){ CONFIG.cinematic=!CONFIG.cinematic; }
});
addEventListener('keyup',e=>{ key[e.code]=false; });

let yaw=-Math.PI*0.5, pitch=-0.25, locked=false;
renderer.domElement.addEventListener('click',()=>{ renderer.domElement.requestPointerLock(); });
document.addEventListener('pointerlockchange',()=>{ locked=document.pointerLockElement===renderer.domElement; });
document.addEventListener('mousemove',e=>{
  if(!locked) return;
  yaw   -= e.movementX*0.0022;
  pitch -= e.movementY*0.0022;
  pitch = THREE.MathUtils.clamp(pitch,-1.5,1.5);
});
const vel=new THREE.Vector3();
function updateCamera(dt){
  const fwd=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  const right=new THREE.Vector3(Math.sin(yaw-Math.PI/2),0,Math.cos(yaw-Math.PI/2));
  let sp = 34;
  if(key['ShiftLeft']||key['ShiftRight']) sp=95;
  if(key['KeyZ']) sp=10;
  const acc=new THREE.Vector3();
  if(key['KeyW']) acc.add(fwd);
  if(key['KeyS']) acc.sub(fwd);
  if(key['KeyD']) acc.add(right);
  if(key['KeyA']) acc.sub(right);
  if(key['Space']) acc.y+=1;
  if(key['ControlLeft']||key['ControlRight']) acc.y-=1;
  if(acc.lengthSq()>0) acc.normalize().multiplyScalar(sp);
  vel.lerp(acc, 1-Math.pow(0.0001,dt));   // suavizado tipo dron
  camera.position.addScaledVector(vel,dt);
  // no bajar del suelo
  const minY=terrainHeight(camera.position.x,camera.position.z)+1.5;
  if(camera.position.y<minY) camera.position.y=minY;
  camera.lookAt(camera.position.clone().add(fwd));
  // HUD
  document.getElementById('tr').innerHTML=
    'ALT '+Math.round(camera.position.y-terrainHeight(camera.position.x,camera.position.z))+' m<br>SPD '+Math.round(vel.length());
}

/* ============================================================
   POST-PROCESO CINEMÁTICO
   ============================================================ */
let composer, bloomPass, gradePass;
const GradeShader = {
  uniforms:{ tDiffuse:{value:null}, time:{value:0}, enabled:{value:1},
             vignette:{value:1.1}, grain:{value:0.06}, ca:{value:0.0016},
             contrast:{value:1.11}, sat:{value:1.14} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float time,enabled,vignette,grain,ca,contrast,sat;
    varying vec2 vUv;
    float rand(vec2 c){ return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv=vUv;
      vec4 col;
      if(enabled>0.5){
        // aberración cromática radial
        vec2 d=(uv-0.5);
        float r=texture2D(tDiffuse,uv-d*ca).r;
        float g=texture2D(tDiffuse,uv).g;
        float b=texture2D(tDiffuse,uv+d*ca).b;
        col=vec4(r,g,b,1.0);
        // contraste
        col.rgb=(col.rgb-0.5)*contrast+0.5;
        // saturación
        float l=dot(col.rgb,vec3(0.2126,0.7152,0.0722));
        col.rgb=mix(vec3(l),col.rgb,sat);
        // teal-orange (cine)
        col.rgb*=vec3(1.05,1.0,0.93);
        col.rgb+=vec3(0.02,0.01,-0.02)*(1.0-l);
        // viñeta
        float vig=smoothstep(0.35,0.95,length(d)*vignette);
        col.rgb*=mix(1.0,0.5,vig);
        // grano de película
        col.rgb+=(rand(uv*vec2(time*60.0+1.0))-0.5)*grain;
      } else {
        col=texture2D(tDiffuse,uv);
      }
      gl_FragColor=col;
    }`
};
/* ============================================================
   LOOP
   ============================================================ */
const clock=new THREE.Clock();
let fireTimer=0;

function tickNPCs(dt, time){
  for(const n of npcs){
    const g=n.g;
    if(n.kind==='patrol'){
      const tgt=n.path[n.wp];
      const dx=tgt.x-g.position.x, dz=tgt.z-g.position.z;
      const dist=Math.hypot(dx,dz);
      if(dist<1.2){ n.wp=(n.wp+1)%n.path.length; }
      else{
        const ux=dx/dist, uz=dz/dist;
        g.position.x+=ux*n.speed*dt; g.position.z+=uz*n.speed*dt;
        g.rotation.y=Math.atan2(ux,uz);
      }
      groundEntity(g);
      // balanceo de caminar
      g.position.y += Math.abs(Math.sin(time*7+n.bob))*0.06;
    }
    else if(n.kind==='guard'){
      n.dir += Math.sin(time*0.5+n.t)*dt*0.6;      // escaneo lento
      g.rotation.y=n.dir;
      groundEntity(g);
    }
    else if(n.kind==='fight'){
      // reposiciones nerviosas + encararse
      g.rotation.y = n.dir + Math.sin(time*3+n.t)*0.25;
      const wob=Math.sin(time*9+n.t)*0.04;
      g.position.x = n.home.x + Math.sin(time*0.8+n.t)*0.5;
      g.position.z = n.home.z + Math.cos(time*0.7+n.t)*0.4;
      groundEntity(g);
      g.position.y += Math.abs(wob);
    }
    else if(n.kind==='escort'){
      const v=n.target;
      if(v){
        const bx=v.g.position.x, bz=v.g.position.z;
        const tx=bx - v.dir*n.offset.z, tz=bz + n.offset.x;
        const dx=tx-g.position.x, dz=tz-g.position.z, d=Math.hypot(dx,dz);
        if(d>0.1){ const sp=Math.min(n.speed, d/dt);
          g.position.x+=dx/d*sp*dt; g.position.z+=dz/d*sp*dt; g.rotation.y=Math.atan2(dx,dz); }
        groundEntity(g);
        g.position.y+=Math.abs(Math.sin(time*7+n.bob))*0.05;
      }
    }
  }

  // disparos del enfrentamiento (muzzle flashes)
  fireTimer-=dt;
  if(fireTimer<=0 && window.__fighters && window.__fighters.length && window.__flashes){
    fireTimer=0.08+Math.random()*0.22;
    const f=window.__fighters[Math.floor(Math.random()*window.__fighters.length)];
    const fl=window.__flashes.find(x=>!x.visible) || window.__flashes[0];
    const fx=f.g.position.x+Math.sin(f.g.rotation.y)*0.6;
    const fz=f.g.position.z+Math.cos(f.g.rotation.y)*0.6;
    fl.position.set(fx, f.g.position.y+1.3, fz);
    fl.visible=true; fl.material.opacity=1; fl.scale.setScalar(1);
    fl.userData.life=0.07;
  }
  if(window.__flashes) for(const fl of window.__flashes){
    if(fl.visible){ fl.userData.life-=dt; fl.material.opacity=Math.max(0,fl.userData.life/0.07);
      fl.scale.multiplyScalar(1+dt*6); if(fl.userData.life<=0) fl.visible=false; }
  }
}

function tickVehicles(dt){
  for(const v of vehicles){
    v.x += v.dir*v.speed*dt;
    if(v.x>280){ v.x=-280; } if(v.x<-280){ v.x=280; }
    const z=mainRoadZ(v.x);
    const y=terrainHeight(v.x,z);
    v.g.position.set(v.x, y+0.2, z);
    // orientar según pendiente de la carretera
    const ahead=v.x+v.dir*3, zAhead=mainRoadZ(ahead);
    v.g.rotation.y=Math.atan2(v.dir*3, zAhead-z);
    // estela de polvo
    if(Math.random()<0.6) spawnVehicleDust(v.x - v.dir*2, z);
  }
}

function tickDust(dt){
  if(!dust) return;
  for(let i=0;i<DUSTN;i++){
    const d=dustData[i];
    dustPos[i*3+1]+=d.vy*dt* (d.road?8:3);
    d.life-=dt*0.25;
    if(d.life<=0 || dustPos[i*3+1]-terrainHeight(d.x,d.z)>6){
      d.life=0.5+Math.random()*0.7;
      dustPos[i*3+1]=terrainHeight(d.x,d.z)+0.2;
    }
    dustPos[i*3]=d.x+Math.sin(performance.now()*0.0003+i)*0.4;
    dustPos[i*3+2]=d.z+Math.cos(performance.now()*0.00027+i)*0.4;
  }
  dust.geometry.attributes.position.needsUpdate=true;
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const time=clock.elapsedTime;
  updateCamera(dt);
  for(const m of mixers) m.update(dt);
  tickNPCs(dt,time);
  tickVehicles(dt);
  tickDust(dt);
  dir.target.position.set(camera.position.x,0,camera.position.z);
  dir.position.set(camera.position.x+sun.x*220, sun.y*220, camera.position.z+sun.z*220);

  if(gradePass){ gradePass.uniforms.time.value=time; gradePass.uniforms.enabled.value=CONFIG.cinematic?1:0; }
  if(composer) composer.render();
  else renderer.render(scene,camera);
}

/* ---- init post con imports reales ---- */
function setupComposer(){
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), Q.bloom, 0.75, 0.85);
  composer.addPass(bloomPass);
  gradePass=new ShaderPass(GradeShader); composer.addPass(gradePass);
  if(CONFIG.quality==='high'){ composer.addPass(new SMAAPass(innerWidth,innerHeight)); }
  composer.addPass(new OutputPass());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(composer) composer.setSize(innerWidth,innerHeight);
});

/* ---- arranque ---- */
startBtn.addEventListener('click',()=>{
  loadEl.style.display='none';
  document.getElementById('hud').classList.add('on');
  renderer.domElement.requestPointerLock();
});
initDust();
setupComposer();
boot();
animate();
</script>
